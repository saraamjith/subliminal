[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subliminal-crossmodal"
version = "1.0.0"
description = "Subliminal learning across modalities: image representations, image generation and a weight lens"
readme = "README.md"
requires-python = ">=3.11"   # scipy 1.17.1 needs Python 3.11
dependencies = [
    "torch==2.10.0",
    "transformers==4.57.6",
    "peft==0.19.1",
    "vllm==0.18.1",
    "accelerate==1.13.0",
    "safetensors==0.7.0",
    "huggingface_hub==0.36.2",
    "numpy==2.2.6",
    "scipy==1.17.1",
    "pillow==12.2.0",
]

[tool.setuptools]
packages = ["sl"]
